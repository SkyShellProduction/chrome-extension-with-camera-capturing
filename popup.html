<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
  <style>body { width: 340px; padding: 14px; }</style>
</head>
<body>
  <div class="row" style="justify-content: space-between;">
    <span class="pill" id="status"><span class="dot" id="statusDot"></span><span id="statusText">…</span></span>
    <button id="toggle">…</button>
  </div>
  <div id="error" class="err small" style="display:none; margin-top:10px;"></div>

  <div class="muted small" style="margin:10px 0 6px;" id="current"></div>

  <div class="grid">
    <div class="tile"><div class="v" id="atDesk">—</div><div class="k">За компом сегодня</div></div>
    <div class="tile"><div class="v" id="phone">—</div><div class="k">Из них в телефоне</div></div>
    <div class="tile"><div class="v" id="breaks">—</div><div class="k">Перерывов</div></div>
    <div class="tile"><div class="v" id="longest">—</div><div class="k">Самая длинная сессия</div></div>
  </div>

  <div class="muted small" id="browserLine" style="margin-top:8px;"></div>
  <div class="small" id="shotResult" style="margin-top:4px;"></div>

  <h2>Сессии сегодня</h2>
  <table id="sessions"><tbody></tbody></table>

  <div class="row" style="margin-top:12px;">
    <button id="stats">Статистика и настройки</button>
    <button id="calibrate" title="Смотрите в экран 5 секунд">Калибровка</button>
    <button id="shot" title="Скриншот текущей вкладки">📸</button>
  </div>

  <details style="margin-top:12px;">
    <summary class="small muted">Что видит модель прямо сейчас</summary>
    <div class="signals" id="signals">Нет данных (камера выключена?)</div>
  </details>

  <script type="module" src="popup.js"></script>
</body>
</html>
